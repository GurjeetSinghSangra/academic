<header class="site-header">
  <nav class="nav wrap" aria-label="Main">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark" aria-hidden="true">∂</span>
      <span>{{ site.author.name }}</span>
    </a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="nav-links" aria-label="Menu">
      <span></span><span></span>
    </button>
    <ul class="nav-links" id="nav-links">
      {% for item in site.nav %}
      {% assign item_url = item.url | relative_url %}
      <li><a href="{{ item_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
      {% endfor %}
      <li>
        <button class="theme-toggle" type="button" aria-label="Toggle dark mode">
          {% include icon.html name="moon" %}{% include icon.html name="sun" %}
        </button>
      </li>
    </ul>
  </nav>
</header>
